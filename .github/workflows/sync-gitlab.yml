name: Sync Repo to GitLab

on:
  push

jobs:
  sync-gitlab:
    runs-on: ubuntu-latest
    steps:
    # Pin the canonical upstream; its internal actions/checkout@v2 remains tag-based.
    - uses: kujov/gitlab-sync@ec05efff6dfa33ffb5398d31caf3a256e5a9ea34 # 2.0.0
      with:
        gitlab_url: ${{ secrets.GITLAB_URL }}
        username: ${{ secrets.USERNAME }}
        gitlab_pat: ${{ secrets.GITLAB_PAT }}
